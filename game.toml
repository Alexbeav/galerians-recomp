stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Galerians (Europe) (Disc 1).bin"
cue_name = "Galerians (Europe) (Disc 1).cue"
boot_exe = "SLES_023.28"
